<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>링크나무 | 김크리 - 모든 링크를 한 곳에</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #0ea5e9;
    --accent-light: #e0f2fe;
    --accent-dark: #0284c7;
    --text-main: #1f2937;
    --text-sub: #4b5563;
    --text-faint: #9ca3af;
    --bg-grad-1: #f0f9ff;
    --bg-grad-2: #e0f2fe;
    --bg-grad-3: #f8fbff;
    --card-bg: #ffffff;
    --border: rgba(14, 165, 233, 0.14);
    --link-bg: #f8fafc;
    --link-border: #e2e8f0;
    --link-hover-bg: #f0f9ff;
    --toggle-bg: #f1f5f9;
    --toggle-border: #e2e8f0;
    --badge-bg: rgba(15, 23, 42, 0.06);
    --badge-text: #64748b;
    --shadow-soft: 0 1px 2px rgba(15, 23, 42, 0.04), 0 20px 40px -16px rgba(14, 165, 233, 0.18);
  }

  :root[data-theme="dark"] {
    --accent: #38bdf8;
    --accent-light: rgba(56, 189, 248, 0.14);
    --accent-dark: #7dd3fc;
    --text-main: #f1f5f9;
    --text-sub: #cbd5e1;
    --text-faint: #64748b;
    --bg-grad-1: #0b1120;
    --bg-grad-2: #0f172a;
    --bg-grad-3: #0b1120;
    --card-bg: #111827;
    --border: rgba(56, 189, 248, 0.16);
    --link-bg: #1a2333;
    --link-border: #263048;
    --link-hover-bg: #1e293b;
    --toggle-bg: #1a2333;
    --toggle-border: #263048;
    --badge-bg: rgba(148, 163, 184, 0.12);
    --badge-text: #94a3b8;
    --shadow-soft: 0 1px 2px rgba(0, 0, 0, 0.3), 0 20px 40px -16px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-main);
    background: linear-gradient(160deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 45%, var(--bg-grad-3) 100%);
    background-attachment: fixed;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--toggle-bg);
    border: 1px solid var(--toggle-border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-sub);
    z-index: 10;
    transition: all 0.2s ease;
  }

  .theme-toggle:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
    transform: translateY(-1px);
  }

  .theme-toggle svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 32px 40px;
    box-shadow: var(--shadow-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: background 0.25s ease, border-color 0.25s ease;
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #0284c7);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    box-shadow: 0 8px 20px -6px rgba(2, 132, 199, 0.55);
    margin-bottom: 18px;
    overflow: hidden;
  }

  .name {
    font-size: 21px;
    font-weight: 800;
    color: var(--text-main);
    margin: 0 0 6px;
    letter-spacing: -0.3px;
  }

  .intro {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-sub);
    margin: 0 0 28px;
    max-width: 300px;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--link-bg);
    border: 1px solid var(--link-border);
    text-decoration: none;
    color: var(--text-main);
    font-weight: 600;
    font-size: 14.5px;
    transition: all 0.15s ease;
    position: relative;
  }

  .link-card:hover {
    background: var(--link-hover-bg);
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .link-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--accent-light);
    color: var(--accent-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .link-icon svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  .link-label {
    flex: 1;
    text-align: left;
  }

  .link-clicks {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--badge-text);
    background: var(--badge-bg);
    padding: 4px 9px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .footer-note {
    font-size: 11.5px;
    color: var(--text-faint);
  }

  @media (max-width: 420px) {
    .card { padding: 40px 22px 32px; }
  }
</style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle" aria-label="다크모드 전환">
    <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM11 1h2v3h-2V1zm0 19h2v3h-2v-3zM3.51 4.93l1.41-1.42L7.05 5.64 5.64 7.05 3.51 4.93zM16.95 18.36l1.41-1.41 2.12 2.12-1.41 1.41-2.12-2.12zM1 11h3v2H1v-2zm19 0h3v2h-3v-2zM3.51 19.07L5.64 16.95l1.41 1.41-2.12 2.12-1.42-1.41zM16.95 5.64l2.12-2.12 1.41 1.41-2.12 2.12-1.41-1.41z"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12.3 3a9 9 0 1 0 8.7 13.3A9.3 9.3 0 0 1 12.3 3z"/></svg>
  </button>

  <div class="card">
    <div class="avatar">김</div>
    <h1 class="name">김크리</h1>
    <p class="intro">그림 그리고 브랜딩하는 프리랜서 디자이너입니다. 작업 문의는 이메일로 주세요.</p>

    <div class="links" id="links">
      <a class="link-card" data-link-id="instagram" href="https://instagram.com" target="_blank" rel="noopener noreferrer">
        <span class="link-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2c2.72 0 3.06.01 4.12.06 1.06.05 1.79.22 2.43.47.66.26 1.21.6 1.76 1.15.5.5.9 1.1 1.15 1.76.25.64.42 1.37.47 2.43.05 1.06.06 1.4.06 4.12s-.01 3.06-.06 4.12c-.05 1.06-.22 1.79-.47 2.43a4.9 4.9 0 0 1-1.15 1.76 4.9 4.9 0 0 1-1.76 1.15c-.64.25-1.37.42-2.43.47-1.06.05-1.4.06-4.12.06s-3.06-.01-4.12-.06c-1.06-.05-1.79-.22-2.43-.47a4.9 4.9 0 0 1-1.76-1.15 4.9 4.9 0 0 1-1.15-1.76c-.25-.64-.42-1.37-.47-2.43C2.01 15.06 2 14.72 2 12s.01-3.06.06-4.12c.05-1.06.22-1.79.47-2.43.26-.66.6-1.21 1.15-1.76A4.9 4.9 0 0 1 5.44 2.53c.64-.25 1.37-.42 2.43-.47C8.94 2.01 9.28 2 12 2zm0 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zm5.2-8.4a1.17 1.17 0 1 1 0-2.34 1.17 1.17 0 0 1 0 2.34z"/></svg>
        </span>
        <span class="link-label">Instagram</span>
        <span class="link-clicks" data-count-for="instagram">0회 클릭</span>
      </a>
      <a class="link-card" data-link-id="youtube" href="https://youtube.com" target="_blank" rel="noopener noreferrer">
        <span class="link-icon">
          <svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.5V8.5l6.3 3.5-6.3 3.5z"/></svg>
        </span>
        <span class="link-label">YouTube</span>
        <span class="link-clicks" data-count-for="youtube">0회 클릭</span>
      </a>
      <a class="link-card" data-link-id="blog" href="https://blog.naver.com" target="_blank" rel="noopener noreferrer">
        <span class="link-icon">
          <svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm2 4v2h5V8H6zm0 4v2h12v-2H6zm0 4v2h9v-2H6z"/></svg>
        </span>
        <span class="link-label">블로그</span>
        <span class="link-clicks" data-count-for="blog">0회 클릭</span>
      </a>
      <a class="link-card" data-link-id="github" href="https://github.com" target="_blank" rel="noopener noreferrer">
        <span class="link-icon">
          <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
        </span>
        <span class="link-label">GitHub</span>
        <span class="link-clicks" data-count-for="github">0회 클릭</span>
      </a>
      <a class="link-card" data-link-id="email" href="mailto:contact@example.com">
        <span class="link-icon">
          <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
        </span>
        <span class="link-label">이메일 문의</span>
        <span class="link-clicks" data-count-for="email">0회 클릭</span>
      </a>
    </div>

    <p class="footer-note">링크나무로 만든 페이지입니다</p>
  </div>

  <script>
    (function () {
      var STORAGE_THEME = 'linknamu_theme';
      var STORAGE_CLICKS = 'linknamu_clicks';
      var root = document.documentElement;
      var toggleBtn = document.getElementById('themeToggle');

      function applyTheme(theme) {
        if (theme === 'dark') {
          root.setAttribute('data-theme', 'dark');
        } else {
          root.setAttribute('data-theme', 'light');
        }
      }

      var savedTheme = localStorage.getItem(STORAGE_THEME);
      if (!savedTheme) {
        savedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      applyTheme(savedTheme);

      toggleBtn.addEventListener('click', function () {
        var current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        var next = current === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        localStorage.setItem(STORAGE_THEME, next);
      });

      function loadClicks() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_CLICKS)) || {};
        } catch (e) {
          return {};
        }
      }

      function saveClicks(clicks) {
        localStorage.setItem(STORAGE_CLICKS, JSON.stringify(clicks));
      }

      function renderClicks(clicks) {
        var badges = document.querySelectorAll('[data-count-for]');
        badges.forEach(function (badge) {
          var id = badge.getAttribute('data-count-for');
          var count = clicks[id] || 0;
          badge.textContent = count + '회 클릭';
        });
      }

      var clicks = loadClicks();
      renderClicks(clicks);

      document.querySelectorAll('.link-card').forEach(function (link) {
        link.addEventListener('click', function () {
          var id = link.getAttribute('data-link-id');
          clicks[id] = (clicks[id] || 0) + 1;
          saveClicks(clicks);
          renderClicks(clicks);
        });
      });
    })();
  </script>

</body>
</html>
